<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" role="img" aria-labelledby="title desc">
<title id="title">Usage Pace example</title><desc id="desc">Illustrative menu bar and popover with synthetic accounts. A signed percentage shows pacing, with green, yellow and red account windows.</desc>
<rect width="960" height="460" fill="#ecefe6"/><g font-family="Avenir Next, sans-serif" fill="#202820">
<text x="70" y="105" font-size="13" letter-spacing="2" fill="#667063">CODEX + CLAUDE</text><text x="70" y="164" font-family="Georgia,serif" font-size="43">Keep the clock</text><text x="70" y="215" font-family="Georgia,serif" font-size="43">next to the quota.</text><text x="70" y="270" font-size="15" fill="#667063">One account. One window. One clear signal.</text>
<rect x="71" y="307" width="57" height="19" rx="5" fill="none" stroke="#667063"/><rect x="75" y="311" width="20" height="11" rx="2" fill="#247548"/><path d="M108 309v15" stroke="#202820" stroke-width="2"/><text x="140" y="324" font-family="monospace" font-size="14">C1</text><text x="174" y="325" font-family="monospace" font-size="24" fill="#247548">-18%</text><text x="70" y="394" font-size="11" fill="#667063">ILLUSTRATIVE VALUES. NO REAL ACCOUNT DATA.</text>
<rect x="501" y="28" width="382" height="403" rx="17" fill="#fffdf8" stroke="#d9ded1"/>
<text x="526" y="62" font-size="20" font-weight="600">Usage Pace</text><text x="526" y="80" font-size="10" fill="#667063">Your accounts, against the clock</text>
<text x="526" y="108" font-size="10" fill="#667063">Menu bar</text><rect x="588" y="94" width="165" height="22" rx="5" fill="#f0f2ec"/><text x="599" y="109" font-size="10">Codex Personal</text><text x="735" y="109" font-size="10">⌄</text><rect x="763" y="94" width="93" height="22" rx="5" fill="#f0f2ec"/><text x="774" y="109" font-size="10">Weekly</text><text x="839" y="109" font-size="10">⌄</text>
<rect x="518" y="128" width="348" height="81" rx="10" fill="#f0f2ec"/><rect x="529" y="141" width="3" height="19" rx="1" fill="#247548"/><text x="540" y="154" font-size="12" font-weight="600">Codex Personal</text><text x="813" y="154" font-size="9" fill="#247548">LIVE</text><text x="530" y="177" font-size="10">Weekly · 22% used</text><text x="756" y="177" font-size="9" fill="#667063">Resets in 4d 4h</text><rect x="530" y="186" width="323" height="6" rx="3" fill="#d9ded1"/><rect x="530" y="186" width="71" height="6" rx="3" fill="#247548"/><path d="M659 183v12" stroke="#202820"/><text x="530" y="202" font-size="9" fill="#247548">18.0 pp behind pace</text>
<rect x="518" y="220" width="348" height="81" rx="10" fill="#f0f2ec"/><rect x="529" y="233" width="3" height="19" rx="1" fill="#247548"/><text x="540" y="246" font-size="12" font-weight="600">Codex Work</text><text x="813" y="246" font-size="9" fill="#247548">LIVE</text><text x="530" y="269" font-size="10">5 hours · 65% used</text><text x="756" y="269" font-size="9" fill="#667063">Resets in 3h</text><rect x="530" y="278" width="323" height="6" rx="3" fill="#d9ded1"/><rect x="530" y="278" width="210" height="6" rx="3" fill="#c14432"/><path d="M659 275v12" stroke="#202820"/><text x="530" y="294" font-size="9" fill="#c14432">25.0 pp ahead of pace</text>
<rect x="518" y="312" width="348" height="81" rx="10" fill="#f0f2ec"/><rect x="529" y="325" width="3" height="19" rx="1" fill="#a97800"/><text x="540" y="338" font-size="12" font-weight="600">Claude</text><text x="813" y="338" font-size="9" fill="#247548">LIVE</text><text x="530" y="361" font-size="10">Weekly · 48% used</text><text x="756" y="361" font-size="9" fill="#667063">Resets in 4d 4h</text><rect x="530" y="370" width="323" height="6" rx="3" fill="#d9ded1"/><rect x="530" y="370" width="155" height="6" rx="3" fill="#a97800"/><path d="M659 367v12" stroke="#202820"/><text x="530" y="386" font-size="9" fill="#a97800">8.0 pp ahead of pace</text>
<text x="526" y="416" font-size="9" fill="#667063">Refreshes every 5 minutes</text><text x="731" y="416" font-size="9" fill="#667063">Marker = time elapsed</text></g></svg>
